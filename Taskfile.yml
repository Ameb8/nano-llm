version: '3'

# nano-llm Taskfile
#
# Canonical quality workflow for nano-llm.
# Implementing coding agents must run `task check` (or relevant targets:
# `task format`, `task lint`, `task test`) before handoff.

tasks:
  default:
    desc: Run canonical quality check workflow
    cmds:
      - task: check

  format:
    desc: Format Rust source code
    cmds:
      - cargo fmt --all

  format-check:
    desc: Verify Rust source code formatting without modifying files
    cmds:
      - cargo fmt --all -- --check

  lint:
    desc: Run Clippy lints with warnings treated as errors
    cmds:
      - cargo clippy --all-targets --all-features -- -D warnings

  test:
    desc: Run automated test suite
    cmds:
      - cargo test --all-targets --all-features

  check:
    desc: Canonical quality check (format verification, linting, and tests)
    cmds:
      - task: format-check
      - task: lint
      - task: test

  release-linux:
    desc: Export reproducible static Linux x86_64 and aarch64 binaries to dist/
    cmds:
      - docker buildx build --platform linux/amd64 --target artifact --output type=local,dest=dist/x86_64 .
      - scripts/verify-static-artifact.sh x86_64 dist/x86_64/nano-llm
      - docker buildx build --platform linux/arm64 --target artifact --output type=local,dest=dist/aarch64 .
      - scripts/verify-static-artifact.sh aarch64 dist/aarch64/nano-llm

  image:
    desc: Build the minimal scratch runtime image for the host architecture
    cmds:
      - docker build --tag nano-llm:local .
