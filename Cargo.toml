[package]
name = "nano-llm"
version = "0.1.0-dev"
edition = "2021"
description = "A lightweight, single-binary LLM routing gateway in Rust"
readme = "README.md"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
saphyr-parser = "0.0.12"
tracing = "0.1"
tracing-subscriber = "0.3"
# Keep TLS self-contained for the scratch image.  In particular, do not enable
# reqwest's native-tls/default features: verification must use packaged WebPKI
# roots rather than files supplied by the host image.
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls-webpki-roots"] }
