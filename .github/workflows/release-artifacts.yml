name: release-artifacts

on:
  workflow_dispatch:
  pull_request:
    paths:
      - Cargo.lock
      - Cargo.toml
      - Dockerfile
      - Taskfile.yml
      - .github/workflows/release-artifacts.yml
      - rust-toolchain.toml
      - scripts/smoke-release-artifact.sh
      - scripts/smoke-runtime-image.sh
      - scripts/verify-static-artifact.sh
      - src/**
      - tests/**

jobs:
  executable-matrix:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.94.0
      - run: cargo test --features executable-test-tls --test executable_matrix_tests -- --test-threads=1

  static-artifact:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            architecture: x86_64
          - platform: linux/arm64
            architecture: aarch64
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          target: artifact
          outputs: type=local,dest=dist/${{ matrix.architecture }}
      - run: scripts/verify-static-artifact.sh ${{ matrix.architecture }} dist/${{ matrix.architecture }}/nano-llm
      - run: scripts/smoke-release-artifact.sh ${{ matrix.architecture }} dist/${{ matrix.architecture }}/nano-llm
      - uses: actions/upload-artifact@v4
        with:
          name: nano-llm-linux-${{ matrix.architecture }}
          path: dist/${{ matrix.architecture }}/nano-llm
          if-no-files-found: error

  scratch-runtime:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: nano-llm:smoke
      - run: scripts/smoke-runtime-image.sh nano-llm:smoke
