name: release-artifacts

on:
  workflow_dispatch:
  pull_request:
    paths:
      - Cargo.lock
      - Cargo.toml
      - Dockerfile
      - .github/workflows/release-artifacts.yml
      - scripts/verify-static-artifact.sh
      - src/**

jobs:
  static-artifact:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            architecture: x86_64
          - platform: linux/arm64
            architecture: aarch64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          target: artifact
          outputs: type=local,dest=dist/${{ matrix.architecture }}
      - run: scripts/verify-static-artifact.sh ${{ matrix.architecture }} dist/${{ matrix.architecture }}/nano-llm
      - uses: actions/upload-artifact@v4
        with:
          name: nano-llm-linux-${{ matrix.architecture }}
          path: dist/${{ matrix.architecture }}/nano-llm
          if-no-files-found: error

  scratch-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: nano-llm:smoke
      - shell: bash
        run: |
          set -euo pipefail
          test "$(docker image inspect nano-llm:smoke --format '{{.Config.Entrypoint}}')" = '[/nano-llm --config /etc/nano-llm/config.yaml --bind 0.0.0.0:4000]'
          test "$(docker image inspect nano-llm:smoke --format '{{.Config.User}}')" = '65532:65532'
          filesystem_container=$(docker create nano-llm:smoke)
          test "$(docker export "$filesystem_container" | tar -t | sort)" = 'nano-llm'
          docker rm "$filesystem_container" >/dev/null
          if docker run --rm nano-llm:smoke >/dev/null 2>&1; then
            echo 'image unexpectedly started without its required config mount' >&2
            exit 1
          fi
          workdir=$(mktemp -d)
          trap 'docker rm -f nano-llm-smoke >/dev/null 2>&1 || true; rm -rf "$workdir"' EXIT
          printf '%s\n' 'model_list:' '  - model_name: local' '    litellm_params:' '      model: openai_compatible/test' '      api_base: http://127.0.0.1:1/v1' 'general_settings:' '  master_key: os.environ/NANO_LLM_MASTER_KEY' > "$workdir/config.yaml"
          docker run -d --name nano-llm-smoke -p 127.0.0.1::4000 -v "$workdir/config.yaml:/etc/nano-llm/config.yaml:ro" -e NANO_LLM_MASTER_KEY=test-key nano-llm:smoke
          for _ in {1..50}; do curl -fsS "http://$(docker port nano-llm-smoke 4000)/health" && exit 0; sleep .1; done
          docker logs nano-llm-smoke
          exit 1
